name: Deploy Laravel to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env

          php artisan key:generate

          # Tidak menggunakan database session
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env

          # Pastikan config lama tidak tersimpan
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

          echo "===== ENV ====="
          grep -E '^(APP_ENV|APP_DEBUG|APP_URL|SESSION_DRIVER|DB_CONNECTION)=' .env || true

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate static pages
        run: |
          set -e

          mkdir -p dist
          mkdir -p dist/tutorial
          mkdir -p dist/masak-pot

          echo "========================================"
          echo "CACHE BLADE"
          echo "========================================"

          php artisan view:cache

          echo "========================================"
          echo "START LARAVEL"
          echo "========================================"

          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > /tmp/laravel.log 2>&1 &

          LARAVEL_PID=$!

          sleep 5

          echo "===== SERVER LOG ====="
          cat /tmp/laravel.log || true

          echo "========================================"
          echo "GENERATE HOMEPAGE"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "===== HOMEPAGE ERROR ====="
            cat dist/index.html || true

            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true

            exit 1
          fi

          echo "========================================"
          echo "GENERATE TUTORIAL"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/tutorial/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/tutorial)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "===== TUTORIAL ERROR ====="
            cat dist/tutorial/index.html || true

            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true

            exit 1
          fi

          echo "========================================"
          echo "GENERATE MASAK POT"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/masak-pot/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/masak-pot)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "===== MASAK POT ERROR ====="
            cat dist/masak-pot/index.html || true

            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true

            exit 1
          fi

          kill $LARAVEL_PID || true

          echo "========================================"
          echo "COPY ASSETS"
          echo "========================================"

          cp -r public/build dist/build

          if [ -d public/data ]; then
            cp -r public/data dist/data
          fi

          if [ -d public/css ]; then
            cp -r public/css dist/css
          fi

          if [ -d public/js ]; then
            cp -r public/js dist/js
          fi

          echo "========================================"
          echo "FIX HOMEPAGE URLS"
          echo "========================================"

          # Homepage berada di:
          # /hansa-fab-page/
          #
          # Semua localhost URL dibuat relatif:
          #
          # http://127.0.0.1:8000/css/welcome.css
          # -> css/welcome.css
          #
          # http://127.0.0.1:8000/build/...
          # -> build/...
          #
          # http://127.0.0.1:8000/tutorial
          # -> tutorial/

          sed -i \
            -e 's|http://127\.0\.0\.1:8000/|./|g' \
            -e 's|https://bacaceritas-coder\.github\.io/hansa-fab-page/|./|g' \
            -e 's|href="/tutorial"|href="tutorial/"|g' \
            -e 's|href="/masak-pot"|href="masak-pot/"|g' \
            dist/index.html

          echo "========================================"
          echo "FIX SUBPAGE URLS"
          echo "========================================"

          # Tutorial dan Masak Pot berada satu level lebih dalam:
          #
          # /hansa-fab-page/tutorial/
          #
          # Jadi asset harus:
          #
          # ../css/
          # ../js/
          # ../build/
          # ../data/

          for FILE in \
            dist/tutorial/index.html \
            dist/masak-pot/index.html
          do

            sed -i \
              -e 's|http://127\.0\.0\.1:8000/css/|../css/|g' \
              -e 's|http://127\.0\.0\.1:8000/js/|../js/|g' \
              -e 's|http://127\.0\.0\.1:8000/build/|../build/|g' \
              -e 's|http://127\.0\.0\.1:8000/data/|../data/|g' \
              -e 's|https://bacaceritas-coder\.github\.io/hansa-fab-page/css/|../css/|g' \
              -e 's|https://bacaceritas-coder\.github\.io/hansa-fab-page/js/|../js/|g' \
              -e 's|https://bacaceritas-coder\.github\.io/hansa-fab-page/build/|../build/|g' \
              -e 's|https://bacaceritas-coder\.github\.io/hansa-fab-page/data/|../data/|g' \
              -e 's|http://127\.0\.0\.1:8000/tutorial|../tutorial/|g' \
              -e 's|http://127\.0\.0\.1:8000/masak-pot|../masak-pot/|g' \
              -e 's|http://127\.0\.0\.1:8000/|../|g' \
              -e 's|href="/"|href="../"|g' \
              "$FILE"

          done

          echo "========================================"
          echo "VERIFY NO LOCALHOST"
          echo "========================================"

          if grep -R -n \
            "127.0.0.1:8000" \
            dist \
            --include="*.html"
          then
            echo ""
            echo "ERROR: Masih ditemukan URL localhost!"
            exit 1
          fi

          echo "Tidak ada URL localhost."

          echo "========================================"
          echo "VERIFY HOMEPAGE ASSETS"
          echo "========================================"

          echo "--- Homepage CSS/JS ---"

          grep -E \
            'href="[^"]+\.css|src="[^"]+\.js' \
            dist/index.html || true

          echo "========================================"
          echo "VERIFY TUTORIAL LINK"
          echo "========================================"

          grep -n "tutorial" dist/index.html || true

          echo "========================================"
          echo "VERIFY CSS FILES"
          echo "========================================"

          echo "--- welcome.css ---"

          test -f dist/css/welcome.css

          echo "--- Vite CSS ---"

          find dist/build/assets \
            -type f \
            -name "*.css" \
            -print

          echo "========================================"
          echo "VERIFY JAVASCRIPT"
          echo "========================================"

          test -f dist/js/welcome.js

          echo "========================================"
          echo "FINAL ARTIFACT"
          echo "========================================"

          find dist -maxdepth 5 -type f -print

          echo "========================================"
          echo "FINAL CHECK"
          echo "========================================"

          test -f dist/index.html
          test -f dist/tutorial/index.html
          test -f dist/masak-pot/index.html

          echo ""
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4