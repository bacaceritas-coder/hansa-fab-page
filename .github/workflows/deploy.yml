name: Deploy Laravel to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env

          php artisan key:generate

          # Static website tidak membutuhkan database session.
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env

          echo "===== ENV ====="
          grep -E '^(APP_ENV|APP_DEBUG|SESSION_DRIVER|DB_CONNECTION)=' .env || true

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate static pages
        run: |
          set -e

          mkdir -p dist/tutorial
          mkdir -p dist/masak-pot

          echo "========================================"
          echo "CACHE BLADE"
          echo "========================================"

          php artisan view:cache

          echo "========================================"
          echo "START LARAVEL"
          echo "========================================"

          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > /tmp/laravel.log 2>&1 &

          LARAVEL_PID=$!

          sleep 5

          cat /tmp/laravel.log || true

          echo "========================================"
          echo "GENERATE HOMEPAGE"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "===== HOMEPAGE ERROR ====="
            cat dist/index.html || true
            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true
            exit 1
          fi

          echo "========================================"
          echo "GENERATE TUTORIAL"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/tutorial/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/tutorial)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "===== TUTORIAL ERROR ====="
            cat dist/tutorial/index.html || true
            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true
            exit 1
          fi

          echo "========================================"
          echo "GENERATE MASAK POT"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/masak-pot/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/masak-pot)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "===== MASAK POT ERROR ====="
            cat dist/masak-pot/index.html || true
            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true
            exit 1
          fi

          kill $LARAVEL_PID || true

          echo "========================================"
          echo "COPY ASSETS"
          echo "========================================"

          cp -r public/build dist/build

          if [ -d public/data ]; then
            cp -r public/data dist/data
          fi

          if [ -d public/css ]; then
            cp -r public/css dist/css
          fi

          if [ -d public/js ]; then
            cp -r public/js dist/js
          fi

          echo "========================================"
          echo "FIX STATIC HTML PATHS"
          echo "========================================"

          #
          # GitHub Pages:
          #
          # https://bacaceritas-coder.github.io/hansa-fab-page/
          #
          # Kita menggunakan path relatif agar asset tidak
          # bergantung pada domain.
          #

          find dist -type f -name "*.html" -print0 |
          xargs -0 sed -i \
            -e 's|href="/hansa-fab-page/build/|href="../build/|g' \
            -e 's|src="/hansa-fab-page/build/|src="../build/|g' \
            -e 's|href="/hansa-fab-page/css/|href="../css/|g' \
            -e 's|src="/hansa-fab-page/css/|src="../css/|g' \
            -e 's|href="/hansa-fab-page/js/|href="../js/|g' \
            -e 's|src="/hansa-fab-page/js/|src="../js/|g' \
            -e 's|href="/hansa-fab-page/data/|href="../data/|g' \
            -e 's|src="/hansa-fab-page/data/|src="../data/|g' \
            -e 's|href="/hansa-fab-page/tutorial"|href="tutorial/"|g' \
            -e 's|href="/hansa-fab-page/masak-pot"|href="masak-pot/"|g'

          #
          # Homepage berada di /hansa-fab-page/
          # sehingga asset cukup menggunakan:
          #
          # build/...
          # css/...
          # js/...
          # data/...
          #
          # dan link:
          #
          # tutorial/
          # masak-pot/
          #

          sed -i \
            -e 's|href="/build/|href="build/|g' \
            -e 's|src="/build/|src="build/|g' \
            -e 's|href="/css/|href="css/|g' \
            -e 's|src="/css/|src="css/|g' \
            -e 's|href="/js/|href="js/|g' \
            -e 's|src="/js/|src="js/|g' \
            -e 's|href="/data/|href="data/|g' \
            -e 's|src="/data/|src="data/|g' \
            -e 's|href="/tutorial"|href="tutorial/"|g' \
            -e 's|href="/masak-pot"|href="masak-pot/"|g' \
            dist/index.html

          echo "========================================"
          echo "CHECK GENERATED HTML"
          echo "========================================"

          echo "--- Homepage assets ---"
          grep -E 'href="[^"]+\.(css|js)|src="[^"]+\.(css|js)' \
            dist/index.html | head -30 || true

          echo "--- Tutorial link ---"
          grep -n "tutorial" dist/index.html | head -10 || true

          echo "========================================"
          echo "FINAL FILES"
          echo "========================================"

          find dist -maxdepth 5 -type f -print

          echo "========================================"
          echo "FILE CHECK"
          echo "========================================"

          test -f dist/index.html
          test -f dist/tutorial/index.html
          test -f dist/masak-pot/index.html

          echo "Build berhasil."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
