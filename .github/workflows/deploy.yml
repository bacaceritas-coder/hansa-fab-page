name: Deploy Laravel to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

          # GitHub Pages hanya membutuhkan HTML statis.
          # Tidak perlu session database.
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env

          echo "===== ENV ====="
          grep -E '^(APP_ENV|APP_DEBUG|SESSION_DRIVER|DB_CONNECTION)=' .env || true

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate static pages
        run: |
          set -e

          mkdir -p dist
          mkdir -p dist/tutorial
          mkdir -p dist/masak-pot

          echo "========================================"
          echo "CACHE BLADE"
          echo "========================================"

          php artisan view:cache

          echo "========================================"
          echo "GIT COMMIT"
          echo "========================================"

          git log -1 --oneline

          echo "========================================"
          echo "WELCOME TITLE"
          echo "========================================"

          grep -n "<title>" resources/views/welcome.blade.php

          echo "========================================"
          echo "VITE MANIFEST"
          echo "========================================"

          cat public/build/manifest.json

          echo "========================================"
          echo "START LARAVEL SERVER"
          echo "========================================"

          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > /tmp/laravel.log 2>&1 &

          LARAVEL_PID=$!

          sleep 5

          echo "========================================"
          echo "LARAVEL SERVER LOG"
          echo "========================================"

          cat /tmp/laravel.log || true

          echo "========================================"
          echo "GENERATE HOMEPAGE"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo ""
            echo "===== HOMEPAGE RESPONSE ====="
            cat dist/index.html || true

            echo ""
            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true

            kill $LARAVEL_PID || true
            exit 1
          fi

          echo "===== HOMEPAGE TITLE ====="

          grep -n "<title>" dist/index.html

          echo "===== HOMEPAGE HANSA FAB ====="

          grep -n -m 5 "Hansa Fab" dist/index.html || true

          echo "========================================"
          echo "GENERATE TUTORIAL"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/tutorial/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/tutorial)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo ""
            echo "===== TUTORIAL RESPONSE ====="
            cat dist/tutorial/index.html || true

            echo ""
            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true

            kill $LARAVEL_PID || true
            exit 1
          fi

          echo "========================================"
          echo "GENERATE MASAK POT"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/masak-pot/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/masak-pot)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo ""
            echo "===== MASAK POT RESPONSE ====="
            cat dist/masak-pot/index.html || true

            echo ""
            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true

            kill $LARAVEL_PID || true
            exit 1
          fi

          kill $LARAVEL_PID || true

          echo "========================================"
          echo "COPY BUILD ASSETS"
          echo "========================================"

          cp -r public/build dist/build

          echo "========================================"
          echo "COPY DATA"
          echo "========================================"

          if [ -d public/data ]; then
            cp -r public/data dist/data
          fi

          echo "========================================"
          echo "COPY CSS"
          echo "========================================"

          if [ -d public/css ]; then
            cp -r public/css dist/css
          fi

          echo "========================================"
          echo "COPY JS"
          echo "========================================"

          if [ -d public/js ]; then
            cp -r public/js dist/js
          fi

          echo "========================================"
          echo "FINAL ARTIFACT"
          echo "========================================"

          find dist -maxdepth 5 -type f -print

          echo "========================================"
          echo "CHECK INDEX FILE"
          echo "========================================"

          ls -lh dist/index.html

          echo "========================================"
          echo "CHECK TUTORIAL"
          echo "========================================"

          ls -lh dist/tutorial/index.html

          echo "========================================"
          echo "CHECK MASAK POT"
          echo "========================================"

          ls -lh dist/masak-pot/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4