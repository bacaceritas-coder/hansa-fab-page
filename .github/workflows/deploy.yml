name: Deploy Laravel to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate static pages
        run: |
          mkdir -p dist

          php artisan view:cache

          echo "===== GIT COMMIT ====="
          git log -1 --oneline

          echo "===== SOURCE WELCOME TITLE ====="
          grep -n "<title>" resources/views/welcome.blade.php

          echo "===== CACHED VIEW TITLE ====="
          grep -R -n "Hansa Fab\|<title>Laravel</title>" storage/framework/views || true

          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          sleep 5

          echo "===== GENERATE HOMEPAGE ====="
          curl -f http://127.0.0.1:8000/ -o dist/index.html

          echo "===== HOMEPAGE TITLE ====="
          grep -n "<title>" dist/index.html

          echo "===== HOMEPAGE HANSA FAB ====="
          grep -n -m 5 "Hansa Fab" dist/index.html || true

          echo "===== GENERATE TUTORIAL ====="
          mkdir -p dist/tutorial
          curl -f http://127.0.0.1:8000/tutorial -o dist/tutorial/index.html

          echo "===== GENERATE MASAK POT ====="
          mkdir -p dist/masak-pot
          curl -f http://127.0.0.1:8000/masak-pot -o dist/masak-pot/index.html

          echo "===== COPY ASSETS ====="
          cp -r public/build dist/build

          if [ -d public/data ]; then
            cp -r public/data dist/data
          fi

          if [ -d public/css ]; then
            cp -r public/css dist/css
          fi

          if [ -d public/js ]; then
            cp -r public/js dist/js
          fi

          echo "===== FINAL ARTIFACT ====="
          find dist -maxdepth 4 -type f -print

          echo "===== INDEX FILE ====="
          ls -lh dist/index.html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4