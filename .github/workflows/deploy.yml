name: Deploy Laravel to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare static site
        run: |
          mkdir -p dist

          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &

          sleep 5

          echo "===== LARAVEL LOG ====="
          cat /tmp/laravel.log

          echo "===== TEST HOMEPAGE ====="
          curl -i http://127.0.0.1:8000/

          echo "===== TEST TUTORIAL ====="
          curl -i http://127.0.0.1:8000/tutorial

          echo "===== TEST MASAK POT ====="
          curl -i http://127.0.0.1:8000/masak-pot

          if [ -d public/css ]; then
            cp -r public/css dist/css
          fi

          if [ -d public/js ]; then
            cp -r public/js dist/js
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4