name: Deploy Laravel to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm install

      - name: Build Vite
        run: npm run build

      - name: Prepare Laravel
        run: |
          touch database/database.sqlite

          php artisan config:clear
          php artisan cache:clear
        env:
          APP_ENV: production
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://127.0.0.1:8000
          SESSION_DRIVER: array
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &

          sleep 5

          curl -I http://127.0.0.1:8000
        env:
          APP_ENV: production
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://127.0.0.1:8000
          SESSION_DRIVER: array
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Generate static pages
        run: |
          rm -rf dist

          mkdir -p dist
          mkdir -p dist/tutorial
          mkdir -p dist/masak-pot

          curl -f http://127.0.0.1:8000/ \
            -o dist/index.html

          curl -f http://127.0.0.1:8000/tutorial \
            -o dist/tutorial/index.html

          curl -f http://127.0.0.1:8000/masak-pot \
            -o dist/masak-pot/index.html

      - name: Copy static assets
        run: |
          cp -r public/css dist/css
          cp -r public/js dist/js
          cp -r public/data dist/data

          if [ -d "public/build" ]; then
            cp -r public/build dist/build
          fi

      # ==========================================================
      # FIX HOMEPAGE
      # ==========================================================
      - name: Fix homepage URLs
        run: |
          sed -i \
            -e 's|http://127\.0\.0\.1:8000#|./#|g' \
            -e 's|http://127\.0\.0\.1:8000/|./|g' \
            -e 's|http://127\.0\.0\.1:8000|./|g' \
            -e 's|href="/tutorial"|href="tutorial/"|g' \
            -e 's|href="/masak-pot"|href="masak-pot/"|g' \
            -e 's|href="/css/|href="css/|g' \
            -e 's|src="/css/|src="css/|g' \
            -e 's|href="/js/|href="js/|g' \
            -e 's|src="/js/|src="js/|g' \
            -e 's|href="/build/|href="build/|g' \
            -e 's|src="/build/|src="build/|g' \
            -e 's|href="/data/|href="data/|g' \
            -e 's|src="/data/|src="data/|g' \
            dist/index.html

      # ==========================================================
      # FIX TUTORIAL + MASAK-POT
      # ==========================================================
      - name: Fix subpage URLs
        run: |
          for FILE in dist/tutorial/index.html dist/masak-pot/index.html
          do
            # ----------------------------------------------------
            # Homepage links
            # ----------------------------------------------------
            sed -i \
              -e 's|href="http://127\.0\.0\.1:8000"|href="../"|g' \
              -e 's|href="http://127\.0\.0\.1:8000/"|href="../"|g' \
              -e 's|href="http://127\.0\.0\.1:8000#|href="../#|g' \
              -e 's|href="http://127\.0\.0\.1:8000/|href="../|g' \
              "$FILE"

            # ----------------------------------------------------
            # Root-relative CSS
            # ----------------------------------------------------
            sed -i \
              -e 's|href="/css/|href="../css/|g' \
              -e 's|src="/css/|src="../css/|g' \
              "$FILE"

            # ----------------------------------------------------
            # Root-relative JavaScript
            # ----------------------------------------------------
            sed -i \
              -e 's|href="/js/|href="../js/|g' \
              -e 's|src="/js/|src="../js/|g' \
              "$FILE"

            # ----------------------------------------------------
            # Vite build
            # ----------------------------------------------------
            sed -i \
              -e 's|href="/build/|href="../build/|g' \
              -e 's|src="/build/|src="../build/|g' \
              "$FILE"

            # ----------------------------------------------------
            # JSON / data
            # ----------------------------------------------------
            sed -i \
              -e 's|href="/data/|href="../data/|g' \
              -e 's|src="/data/|src="../data/|g' \
              "$FILE"

            # ----------------------------------------------------
            # Tutorial / Masak Pot navigation
            # ----------------------------------------------------
            sed -i \
              -e 's|href="/tutorial"|href="../tutorial/"|g' \
              -e 's|href="/masak-pot"|href="../masak-pot/"|g' \
              "$FILE"

            # ----------------------------------------------------
            # Absolute localhost URLs yang masih tersisa
            # ----------------------------------------------------
            sed -i \
              -e 's|http://127\.0\.0\.1:8000#|../#|g' \
              -e 's|http://127\.0\.0\.1:8000/|../|g' \
              -e 's|http://127\.0\.0\.1:8000|../|g' \
              "$FILE"
          done

      # ==========================================================
      # FINAL CLEANUP
      # ==========================================================
      - name: Remove localhost URLs
        run: |
          find dist -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -print0 |
          while IFS= read -r -d '' FILE
          do
            sed -i \
              -e 's|http://127\.0\.0\.1:8000|.|g' \
              "$FILE"
          done

      # ==========================================================
      # VERIFY
      # ==========================================================
      - name: Verify generated files
        run: |
          echo "======================================"
          echo "VERIFY GENERATED FILES"
          echo "======================================"

          echo ""
          echo "HTML files:"
          find dist -type f -name "*.html"

          echo ""
          echo "Assets:"
          ls -lah dist/css || true
          ls -lah dist/js || true
          ls -lah dist/build || true

          echo ""
          echo "Required files:"

          test -f dist/index.html
          test -f dist/tutorial/index.html
          test -f dist/masak-pot/index.html
          test -f dist/css/welcome.css
          test -f dist/js/welcome.js

          echo ""
          echo "Checking localhost URLs..."

          if grep -R -n "127.0.0.1:8000" dist --include="*.html"; then
            echo ""
            echo "ERROR: Masih ditemukan URL localhost!"
            exit 1
          fi

          echo ""
          echo "SUCCESS: Tidak ada URL localhost."
          echo "======================================"

      # ==========================================================
      # UPLOAD GITHUB PAGES ARTIFACT
      # ==========================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4