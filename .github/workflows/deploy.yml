name: Deploy Laravel to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

          # Website akan menjadi static HTML.
          # Tidak membutuhkan session/database.
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env

          echo "===== ENV ====="
          grep -E '^(APP_ENV|APP_DEBUG|SESSION_DRIVER|DB_CONNECTION)=' .env || true

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate static pages
        run: |
          set -e

          mkdir -p dist/tutorial
          mkdir -p dist/masak-pot

          echo "========================================"
          echo "CACHE BLADE"
          echo "========================================"

          php artisan view:cache

          echo "========================================"
          echo "START LARAVEL"
          echo "========================================"

          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > /tmp/laravel.log 2>&1 &

          LARAVEL_PID=$!

          sleep 5

          echo "===== LARAVEL LOG ====="
          cat /tmp/laravel.log || true

          echo "========================================"
          echo "GENERATE HOMEPAGE"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "===== HOMEPAGE ERROR ====="
            cat dist/index.html || true

            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true

            kill $LARAVEL_PID || true
            exit 1
          fi

          echo "===== HOMEPAGE TITLE ====="
          grep -n "<title>" dist/index.html || true

          echo "========================================"
          echo "GENERATE TUTORIAL"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/tutorial/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/tutorial)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "===== TUTORIAL ERROR ====="
            cat dist/tutorial/index.html || true

            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true

            kill $LARAVEL_PID || true
            exit 1
          fi

          echo "========================================"
          echo "GENERATE MASAK POT"
          echo "========================================"

          STATUS=$(curl -sS \
            -o dist/masak-pot/index.html \
            -w "%{http_code}" \
            http://127.0.0.1:8000/masak-pot)

          echo "HTTP STATUS: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "===== MASAK POT ERROR ====="
            cat dist/masak-pot/index.html || true

            echo "===== LARAVEL LOG ====="
            cat /tmp/laravel.log || true

            kill $LARAVEL_PID || true
            exit 1
          fi

          kill $LARAVEL_PID || true

          echo "========================================"
          echo "COPY VITE BUILD"
          echo "========================================"

          cp -r public/build dist/build

          echo "========================================"
          echo "COPY DATA"
          echo "========================================"

          if [ -d public/data ]; then
            cp -r public/data dist/data
          fi

          echo "========================================"
          echo "COPY CSS"
          echo "========================================"

          if [ -d public/css ]; then
            cp -r public/css dist/css
          fi

          echo "========================================"
          echo "COPY JS"
          echo "========================================"

          if [ -d public/js ]; then
            cp -r public/js dist/js
          fi

          echo "========================================"
          echo "FIX GITHUB PAGES BASE PATH"
          echo "========================================"

          # GitHub Pages project site menggunakan:
          # /hansa-fab-page/
          #
          # Mengubah URL root seperti:
          # /build/...
          # /css/...
          # /js/...
          # /data/...
          # /tutorial
          #
          # menjadi:
          # /hansa-fab-page/build/...
          # /hansa-fab-page/css/...
          # /hansa-fab-page/js/...
          # /hansa-fab-page/data/...
          # /hansa-fab-page/tutorial/

          find dist -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) -print0 |
          xargs -0 sed -i \
            -e 's|href="/build/|href="/hansa-fab-page/build/|g' \
            -e 's|src="/build/|src="/hansa-fab-page/build/|g' \
            -e 's|href="/css/|href="/hansa-fab-page/css/|g' \
            -e 's|src="/css/|src="/hansa-fab-page/css/|g' \
            -e 's|href="/js/|href="/hansa-fab-page/js/|g' \
            -e 's|src="/js/|src="/hansa-fab-page/js/|g' \
            -e 's|href="/data/|href="/hansa-fab-page/data/|g' \
            -e 's|src="/data/|src="/hansa-fab-page/data/|g' \
            -e 's|href="/tutorial"|href="/hansa-fab-page/tutorial/"|g' \
            -e 's|href="/masak-pot"|href="/hansa-fab-page/masak-pot/"|g'

          echo "========================================"
          echo "FINAL ARTIFACT"
          echo "========================================"

          find dist -maxdepth 5 -type f -print

          echo "========================================"
          echo "CHECK FILES"
          echo "========================================"

          ls -lh dist/index.html
          ls -lh dist/tutorial/index.html
          ls -lh dist/masak-pot/index.html

          echo "========================================"
          echo "CHECK BASE PATH"
          echo "========================================"

          echo "--- Homepage ---"
          grep -o 'href="/hansa-fab-page/[^"]*"' dist/index.html | head -20 || true

          echo "--- Tutorial link ---"
          grep -n "tutorial" dist/index.html | head -10 || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4