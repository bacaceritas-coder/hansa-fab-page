name: Deploy Laravel to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare static site
        run: |
          mkdir -p dist

          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &

          sleep 5

          echo "===== SERVER LOG ====="
          cat /tmp/laravel.log

          echo "===== LARAVEL STATUS ====="
          php artisan about || true

          echo "===== VITE MANIFEST ====="
          ls -lah public/build || true
          cat public/build/manifest.json || true

          echo "===== STORAGE LOG ====="
          ls -lah storage/logs || true
          cat storage/logs/laravel.log || true

          echo "===== ROUTES ====="
          php artisan route:list

          echo "===== WELCOME VIEW ====="
          php artisan view:cache || true

          echo "===== TEST HOMEPAGE BODY ====="
          curl -sS http://127.0.0.1:8000/ -o /tmp/homepage.html || true

          echo "===== HOMEPAGE RESPONSE ====="
          cat /tmp/homepage.html

          echo "===== LARAVEL LOG AFTER REQUEST ====="
          cat storage/logs/laravel.log || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4